name: Door Stein Bridge (Test)
version: "0.3.0"
slug: door_stein_bridge
description: Signierte Öffnungsaufträge ausschließlich an Home-Assistant-Test-Helper weiterleiten.
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
init: false
homeassistant_api: true
hassio_api: true
map:
  - type: homeassistant_config
    read_only: true
options:
  worker_url: "https://stein-door.p-63e.workers.dev"
  poll_seconds: 5
  pulse_seconds: 1
  secrets_file: "secrets.yaml"
  security_selftest: true
  emergency_stop: false
schema:
  worker_url: url
  poll_seconds: "int(2,60)"
  pulse_seconds: "int(1,5)"
  secrets_file: str
  security_selftest: bool
  emergency_stop: bool
